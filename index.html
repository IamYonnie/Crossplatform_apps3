<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .a-scene {
            width: 100vw !important;
            height: 100vh !important;
        }
        .a-scene video {
            width: 100vw !important;
            height: 100vh !important;
            left: 0 !important;
            top: 0 !important;
            position: absolute !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <a-scene mindar-face="uiLoading: no; uiScanning: no; uiError: no"
             embedded color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             fullscreen-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="maskModel" src="japanese_demon_mask/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 10">
            <a-entity gltf-model="#maskModel"
                      rotation="0 93 10" 
                      position="0.03 -1.2 -0.22" 
                      scale="0.25 0.28 0.25"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var scene = document.querySelector('a-scene');
            if (!scene) return;

            var tryFixVideo = setInterval(function() {
                var video = document.querySelector('a-scene video');
                if (video) {
                    video.style.setProperty('width', '100vw', 'important');
                    video.style.setProperty('height', '100vh', 'important');
                    video.style.setProperty('left', '0', 'important');
                    video.style.setProperty('top', '0', 'important');
                    video.style.setProperty('position', 'absolute', 'important');
                    video.style.setProperty('object-fit', 'cover', 'important');
                    clearInterval(tryFixVideo);
                    console.log('Видео-стили применены принудительно');
                }
            }, 200);

            scene.addEventListener('loaded', function() {
                setTimeout(function() {
                    window.dispatchEvent(new Event('resize'));
                }, 500);
            });
        });
    </script>
</body>
</html>
