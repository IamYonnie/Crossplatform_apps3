<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    
    <style>

        .a-scene video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            left: 0 !important;
            top: 0 !important;
            position: absolute !important;
        }
        
        .a-scene {
            width: 100vw !important;
            height: 100vh !important;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <a-scene mindar-face embedded color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             fullscreen-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="maskModel" src="japanese_demon_mask/scene.gltf"></a-asset-item>
            
            <a-asset-item id="headOccluder" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 10">
            <a-gltf-model mindar-face-occluder 
                          position="0 -0.3 0.15" 
                          rotation="0 0 0" 
                          scale="0.065 0.065 0.065" 
                          src="#headOccluder"></a-gltf-model>

            <a-gltf-model rotation="0 93 10" 
                          position="0.05 -1.18 -0.22" 
                          scale="0.26 0.28 0.23" 
                          src="#maskModel"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var scene = document.querySelector('a-scene');
            if (scene) {
                scene.addEventListener('loaded', function() {
                    setTimeout(function() {
                        window.dispatchEvent(new Event('resize'));
                    }, 500);
                });
            }
        });
    </script>
</body>
</html>
