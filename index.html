<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR — примерка демонической маски</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    #tip {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 7px 15px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #f2f2f2;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 18px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="tip">Наведите камеру на лицо</div>

  <a-scene
    mindar-face
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true">

    <!-- Освещение -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5; position: 0 1 1"></a-entity>

    <!-- Камера -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Якорь 168 - центр лица -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        src="japanese_demon_mask.glb"
        position="0.03 -0.85 -0.22"
        rotation="0 93 10"
        scale="0.25 0.28 0.28">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
