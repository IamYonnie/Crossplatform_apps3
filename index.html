<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        /* 1. Принудительно растягиваем сцену и тело на весь экран */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        a-scene {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed;
            top: 0;
            left: 0;
        }
        /* 2. Стили для кнопки запуска */
        #start-button {
            position: fixed;
            z-index: 9999;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            display: block; /* Показываем кнопку */
        }
    </style>
</head>
<body>
    <!-- 3. Кнопка запуска, которая исчезнет после клика -->
    <button id="start-button">Запустить AR</button>

    <a-scene mindar-face embedded color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="maskModel" src="japanese_demon_mask/scene.gltf"></a-asset-item>
            <a-asset-item id="headOccluder" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 10">
            <a-gltf-model mindar-face-occluder 
                          position="0 -0.3 0.15" 
                          rotation="0 0 0" 
                          scale="0.065 0.065 0.065" 
                          src="#headOccluder"></a-gltf-model>

            <a-gltf-model rotation="0 93 10" 
                          position="0.03 -1.2 -0.22" 
                          scale="0.25 0.28 0.25" 
                          src="#maskModel"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // 4. Скрипт для обработки нажатия кнопки и запуска MindAR
        const startButton = document.getElementById('start-button');
        const scene = document.querySelector('a-scene');

        // Скрываем кнопку, пока сцена не загрузилась
        startButton.style.display = 'none';

        scene.addEventListener('loaded', () => {
            // Сцена загружена, показываем кнопку
            startButton.style.display = 'block';
            
            startButton.addEventListener('click', () => {
                startButton.style.display = 'none';
                // Здесь можно добавить принудительный запрос прав, если нужно
                // Но обычно MindAR сам запрашивает доступ при старте
                scene.systems['mindar-face-system'].start();
            }, { once: true }); // Сработает только один раз
        });
    </script>
</body>
</html>
